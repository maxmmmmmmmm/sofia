<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Cormorant+SC:wght@400&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
.sf-root {

  --sf-bg:          #faf8f6;
  --sf-bg-sunk:     #f1ece7;
  --sf-ink:         #262320;
  --sf-ink-soft:    #6f6862;
  --sf-ink-faint:   #a39a91;
  --sf-line:        #e2dad1;
  --sf-line-soft:   #ede7e0;
  --sf-ink-ghost:   #b8b0a8;

  --sf-ink-nav:     #55504a;

  --sf-ink-text:    #453f3a;

  --sf-overlay:     rgba(250, 248, 246, 0.93);

  --sf-overlay-soft: rgba(250, 248, 246, 0.86);

  --sf-serif: "Cormorant Garamond", Cormorant, Georgia, "Times New Roman", serif;

  --sf-sans:  "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
              sans-serif;

  --sf-display: "Jost", -apple-system, Arial, sans-serif;

  --sf-fs-display: clamp(30px, 5.2vw, 58px);
  --sf-fs-h2:      clamp(24px, 3.6vw, 40px);
  --sf-fs-h3:      clamp(17px, 1.5vw, 21px);
  --sf-fs-lead:    clamp(15px, 1.35vw, 17px);
  --sf-fs-body:    15px;
  --sf-fs-nav:     16px;
  --sf-fs-micro:   11px;

  --sf-track-wide: 0.18em;
  --sf-track-logo: 0.26em;

  --sf-rhythm: 12px;
  --sf-pad-x:  clamp(16px, 4vw, 51px);
  --sf-sect-y: clamp(64px, 9vw, 132px);
  --sf-gap:    1px;

  --sf-row-h: clamp(150px, 23vw, 330px);

  --sf-header-h: 68px;

  --sf-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

.sf-root *,
.sf-root *::before,
.sf-root *::after { box-sizing: border-box; }

.sf-root {
  background: var(--sf-bg);
  color: var(--sf-ink);
  font-family: var(--sf-sans);
  font-size: var(--sf-fs-body);
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.sf-root :where(img) { display: block; max-width: 100%; height: auto; }

.sf-root :where(a) { color: inherit; text-decoration: none; }

.sf-root :where(p) { margin: 0 0 1.15em; }
.sf-root :where(p:last-child) { margin-bottom: 0; }

.sf-root :where(h1, h2, h3, h4) {
  margin: 0;
  font-family: var(--sf-serif);
  font-weight: 400;
  line-height: 1.16;
  letter-spacing: 0.005em;
}

.sf-root :focus-visible {
  outline: 1px solid var(--sf-ink);
  outline-offset: 3px;
}

.sf-wrap        { padding-inline: var(--sf-pad-x); }
.sf-sect { padding-block: var(--sf-sect-y); }

.sf-abouttitle {
  font-family: var(--sf-serif);
  font-weight: 400;
  font-size: clamp(26px, 3.2vw, 38px);
  line-height: 1.15;
  letter-spacing: 0.01em;
}
.sf-abouttitle__role {
  display: block;

  margin-top: 14px;
  font-family: var(--sf-sans);
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--sf-ink-faint);
}

.sf-lead {

  font-size: 15px;
  font-weight: 300;
  line-height: 1.8;
  color: var(--sf-ink-text);
}
@media (max-width: 980px) { .sf-lead { font-size: 14px; line-height: 1.75; } }
.sf-lead p + p { margin-top: 1.5em; }

.sf-vh {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.sf-header {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: var(--sf-header-h);
  padding-inline: var(--sf-pad-x);

  background: var(--sf-bg);
}

.sf-header--fixed { position: fixed; top: 0; left: 0; right: 0; }
.sf-header--fixed + * { padding-top: var(--sf-header-h); }

.sf-header__nav { display: flex; gap: clamp(16px, 2.6vw, 42px); }

.sf-header__link {
  position: relative;

  font-family: var(--sf-serif);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--sf-ink-nav);
  white-space: nowrap;
  transition: color 0.3s var(--sf-ease);
}
.sf-header__link:hover { color: var(--sf-ink); }
.sf-header__link.is-active { color: var(--sf-ink); font-weight: 500; }

.sf-pagename { display: none; }

.sf-header__side {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: clamp(14px, 2vw, 26px);
}

.sf-logo {
  font-family: var(--sf-serif);
  font-size: 24px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}

.sf-lang { display: flex; align-items: center; gap: 6px; font-size: var(--sf-fs-micro); }
.sf-lang__btn {
  border: 0;
  background: none;
  padding: 2px;
  font: inherit;
  letter-spacing: 0.08em;
  color: var(--sf-ink-faint);
  cursor: pointer;
  transition: color 0.3s var(--sf-ease);
}
.sf-lang__btn:hover { color: var(--sf-ink); }
.sf-lang__btn.is-active { color: var(--sf-ink); }
.sf-lang__sep { color: var(--sf-line); }

.sf-burger {
  display: none;
  width: 30px; height: 30px;
  margin-left: auto;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  position: relative;
}
.sf-burger span {
  position: absolute;
  left: 4px;
  width: 22px; height: 1px;
  background: var(--sf-ink);
  transition: transform 0.4s var(--sf-ease), opacity 0.25s var(--sf-ease);
}
.sf-burger span:nth-child(1) { top: 11px; }
.sf-burger span:nth-child(2) { top: 18px; }
.sf-burger.is-open span:nth-child(1) { transform: translateY(3.5px) rotate(45deg); }
.sf-burger.is-open span:nth-child(2) { transform: translateY(-3.5px) rotate(-45deg); }

.sf-drawer {
  position: fixed;
  inset: var(--sf-header-h) 0 0;
  z-index: 55;
  display: flex;
  flex-direction: column;
  justify-content: center;

  align-items: center;
  text-align: center;

  gap: clamp(30px, 4.93vh, 46px);
  padding: 0 var(--sf-pad-x) 10vh;
  background: var(--sf-bg);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);

  transition: opacity 0.4s var(--sf-ease), transform 0.4s var(--sf-ease), visibility 0s 0.4s;
}
.sf-drawer.is-open {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity 0.4s var(--sf-ease), transform 0.4s var(--sf-ease), visibility 0s 0s;
}

.sf-drawer__link {
  font-family: var(--sf-serif);

  font-size: 14px;
  text-transform: uppercase;

  letter-spacing: 0.14em;

  padding-block: 12px;
  margin-block: -12px;
  color: var(--sf-ink);
}
.sf-drawer__link.is-active { color: var(--sf-ink-faint); }

@media (max-width: 980px) {

  .sf-root { --sf-header-h: 66px; }
  .sf-header__nav { display: none; }

  .sf-header { position: sticky; justify-content: space-between; }
  .sf-header__side { margin-left: 0; order: -1; }
  .sf-logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    white-space: nowrap;
  }

  .sf-body--home .sf-logo,
  .sf-body--gallery .sf-logo,
  .sf-body--price .sf-logo { display: none; }

  .sf-body--gallery .sf-pagename,
  .sf-body--price .sf-pagename {
    display: block;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--sf-serif);
    font-size: 17px;
    letter-spacing: var(--sf-track-logo);
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--sf-ink);
  }

  .sf-body--gallery .sf-pagehead,
  .sf-body--price .sf-pricehead { padding: 0; }
  .sf-body--gallery .sf-pagehead__title,
  .sf-body--price .sf-pricehead .sf-pagehead__title {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}
@media (min-width: 981px) {
  .sf-drawer { display: none; }
}
@media (max-width: 980px) {
  .sf-burger { display: block; }
}

.sf-mosaic {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sf-gap);

  padding-inline: 0;
}
.sf-mosaic__item[hidden] { display: none; }

@media (max-width: 700px) {

  .sf-homegrid { --sf-row-h: 88px; }
}

.sf-mosaic__item {
  position: relative;
  margin: 0;
  min-width: 0;

  flex-grow: calc(var(--ar) * 100);
  flex-shrink: 1;
  flex-basis: calc(var(--ar) * var(--sf-row-h));
  aspect-ratio: var(--ar);
  overflow: hidden;
  background: var(--sf-bg-sunk);
}

.sf-mosaic__item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1.1s var(--sf-ease);
}

@media (hover: hover) {
  .sf-mosaic__btn:hover img { transform: scale(1.035); }
}

.sf-mosaic__btn {
  display: block;
  width: 100%; height: 100%;
  border: 0; padding: 0; margin: 0;
  background: none;
  cursor: zoom-in;
}

.sf-mosaic__fill {
  flex-grow: calc(var(--ar) * 100);
  flex-basis: calc(var(--ar) * var(--sf-row-h));
  height: 0;
  margin: 0;
}

.sf-social {
  display: flex;
  justify-content: center;
  gap: 22px;
}
.sf-social a {
  display: block;
  color: var(--sf-ink-faint);
  transition: color 0.3s var(--sf-ease);
}
.sf-social a:hover { color: var(--sf-ink); }
.sf-social svg {
  width: 17px; height: 17px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sf-homegrid .sf-mosaic__fill { display: none; }

.sf-strapline {
  text-align: center;

  padding: clamp(22px, 4vw, 36px) var(--sf-pad-x) clamp(20px, 3.4vw, 30px);
}
.sf-strapline__line,
.sf-strapline__name {
  margin: 0;
  font-family: var(--sf-display);
  text-transform: uppercase;
}
.sf-strapline__line {
  font-weight: 300;
  font-size: clamp(9px, 2.6vw, 11px);
  letter-spacing: 0.26em;
  color: var(--sf-ink-nav);
}
.sf-strapline__name {
  margin: 0.42em 0;
  font-family: var(--sf-serif);
  font-weight: 400;
  font-size: clamp(21px, 6.4vw, 30px);
  letter-spacing: 0.2em;
  color: var(--sf-ink);
}

.sf-tagline {
  text-align: center;
  padding: clamp(46px, 6vw, 92px) var(--sf-pad-x) clamp(30px, 4vw, 60px);
}

.sf-tagline__text {
  margin: 0;

  font-family: var(--sf-sans);
  font-weight: 300;
  text-transform: lowercase;

  font-size: 14px;
  letter-spacing: 0.2em;
  color: var(--sf-ink-nav);
  opacity: 0.9;
  line-height: 1.75;
}

.sf-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(28px, 5vw, 78px);
  align-items: center;
  max-width: 1240px;
  margin-inline: auto;
}
.sf-split--narrow { max-width: 1140px; grid-template-columns: 0.78fr 1fr; }
.sf-split__media img { width: 100%; }
.sf-split__body { max-width: 58ch; }

@media (max-width: 820px) {
  .sf-split {
    display: grid;

    grid-template-columns: 48% minmax(0, 1fr);
    column-gap: calc(var(--sf-rhythm) * 1.5);
    row-gap: calc(var(--sf-rhythm) * 2);
    max-width: none;
  }

  .sf-split__body { display: contents; max-width: none; }
  .sf-split__media {
    grid-column: 1; grid-row: 1;

    aspect-ratio: 4 / 5;
  }
  .sf-split__media img {
    height: 100%;
    object-fit: cover;
    object-position: 55% 38%;
  }

  .sf-abouttitle {
    grid-column: 2; grid-row: 1;
    align-self: center;
    display: flex; flex-direction: column; align-items: flex-start;

    font-size: clamp(22px, 7.4vw, 32px);
  }

  .sf-abouttitle > span[data-l] {
    display: block;
    width: min-content;
  }
  .sf-abouttitle__role {
    order: -1;
    margin-top: 0;
    margin-bottom: var(--sf-rhythm);

    font-size: clamp(10.5px, 3.3vw, 13px);
  }
  .sf-split__body .sf-lead {
    grid-column: 1 / -1; grid-row: 2;
    margin-top: 0 !important;
    text-align: left;
    hyphens: none; -webkit-hyphens: none;
  }

  .sf-lead > [data-l] > p + p { margin-top: calc(var(--sf-rhythm) * 2); }
  .sf-lead > [data-l] > p + p::before {
    content: "";
    display: block;
    width: 36px;
    height: 1px;
    background: var(--sf-ink-faint);
    margin-bottom: calc(var(--sf-rhythm) * 2);
  }
}

.sf-pagehead {
  padding: clamp(24px, 3vw, 34px) var(--sf-pad-x) clamp(18px, 2.4vw, 30px);
  text-align: center;
}

.sf-pagehead__title {

  font-family: "Cormorant SC", var(--sf-serif);
  font-weight: 400;

  font-size: 17px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sf-ink-nav);
}

.sf-tabs {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding-bottom: clamp(30px, 4vw, 52px);
}
.sf-tab {
  border: 0;
  background: none;
  padding: 4px 0;
  font: inherit;
  font-size: var(--sf-fs-micro);
  letter-spacing: var(--sf-track-wide);
  text-transform: uppercase;
  color: var(--sf-ink-faint);
  cursor: pointer;
  transition: color 0.3s var(--sf-ease);
}

.sf-tab:hover { color: var(--sf-ink-nav); }
.sf-tab.is-active { color: var(--sf-ink-nav); font-weight: 500; }

.sf-pricelist { display: grid; }
.sf-pricelist[hidden] { display: none; }

.sf-pack {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1fr);
  gap: clamp(26px, 5vw, 76px);
  align-items: center;

  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding-block: clamp(34px, 5vw, 68px);
}

.sf-pack + .sf-pack { padding-top: clamp(52px, 7vw, 104px); }
.sf-pack:nth-child(even) .sf-pack__media { order: 2; }

.sf-pack__media { aspect-ratio: 4 / 5; overflow: hidden; background: var(--sf-bg-sunk); }
.sf-pack__media img { width: 100%; height: 100%; object-fit: cover; }

@media (min-width: 900px) {
  .sf-pack__media {
    --sf-bleed: max(var(--sf-pad-x), 50vw - 590px);

    --sf-bleed-l: 0px;
    --sf-bleed-r: 0px;
    margin-left: calc(-1 * var(--sf-bleed-l));
    margin-right: calc(-1 * var(--sf-bleed-r));
    width: calc(100% + var(--sf-bleed-l) + var(--sf-bleed-r));
  }

  .sf-pack:nth-child(odd)  .sf-pack__media { --sf-bleed-l: var(--sf-bleed); }
  .sf-pack:nth-child(even) .sf-pack__media { --sf-bleed-r: var(--sf-bleed); }
}

.sf-pack__body { max-width: 44ch; }

.sf-pack__name {
  font-family: var(--sf-sans);
  font-weight: 400;
  font-size: clamp(13px, 1.3vw, 15px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sf-ink);
}
.sf-pack__price {
  margin-top: 0.5em;
  font-family: var(--sf-serif);
  font-size: clamp(30px, 3.2vw, 40px);
  line-height: 1.1;
  color: var(--sf-ink);
}

.sf-pack__price--request {
  font-size: clamp(20px, 2.4vw, 30px);
}

.sf-pack__list { list-style: none; margin: 1.7em 0 0; padding: 0; }

.sf-pack__list li {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.8;
  color: var(--sf-ink-text);
}
.sf-pack__list li + li { margin-top: 0.6em; }

.sf-pack__extras {
  margin-top: 1.9em;
  font-size: 12px;
  color: var(--sf-ink-faint);

  line-height: 1.45;
  max-width: 42ch;
}

.sf-pack__note {
  display: block;
  margin-top: 0.9em;
}

.sf-pack__extra { white-space: nowrap; }
.sf-pack__extra:not(:last-child)::after { content: " ·"; }

.sf-pack__extras strong {
  display: block;
  margin-bottom: 0.45em;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: var(--sf-track-wide);
  text-transform: uppercase;
  color: var(--sf-ink-faint);
}

@media (max-width: 820px) {
  .sf-pack {
    grid-template-columns: minmax(0, 0.52fr) minmax(0, 0.48fr);
    grid-template-areas:
      "media name"
      "media price"
      "media list"
      "extras extras";

    grid-template-rows: auto auto 1fr auto;
    column-gap: clamp(14px, 4vw, 22px);
    row-gap: 0;
    align-items: start;
    padding-block: calc(var(--sf-rhythm) * 2);
  }

  .sf-pack__body { display: contents; }
  .sf-pack__media {
    grid-area: media;

    align-self: start;
    height: calc(var(--sf-rhythm) * 25);
    aspect-ratio: auto;

    margin-left: calc(-1 * var(--sf-pad-x));
    width: calc(100% + var(--sf-pad-x));
    position: relative;
    min-height: 0;

    margin-top: calc(-2 * var(--sf-rhythm));
    margin-bottom: calc(-2 * var(--sf-rhythm));
  }
  .sf-pack__media img { position: absolute; inset: 0; }

  .sf-pack:nth-child(even) {
    grid-template-columns: minmax(0, 0.48fr) minmax(0, 0.52fr);
    grid-template-areas:
      "name  media"
      "price media"
      "list  media"
      "extras extras";
  }
  .sf-pack:nth-child(even) .sf-pack__media {
    order: 0;
    margin-left: 0;
    margin-right: calc(-1 * var(--sf-pad-x));
  }
  .sf-pack__name   { grid-area: name; font-size: 14px; letter-spacing: 0.16em; }
  .sf-pack__price  {
    grid-area: price;
    font-size: 28px;
    margin-top: var(--sf-rhythm);
    margin-bottom: 0;
  }

  .sf-pack__price--request {
    grid-area: extras;
    margin-top: calc(var(--sf-rhythm) * 3);
    margin-bottom: 0;
    font-family: var(--sf-sans);
    font-weight: 500;
    font-size: 10px;
    line-height: 1.45;
    letter-spacing: var(--sf-track-wide);
    text-transform: uppercase;
    color: var(--sf-ink-faint);
  }
  .sf-pack__list   { grid-area: list; margin-top: calc(var(--sf-rhythm) * 2); }
  .sf-pack__list li { font-size: 13px; line-height: 1.7; }
  .sf-pack__list li + li { margin-top: var(--sf-rhythm); }
  .sf-pack__extras {
    grid-area: extras;
    max-width: none;
    margin-top: calc(var(--sf-rhythm) * 3);
  }
  .sf-pack__note { margin-top: var(--sf-rhythm); }

  .sf-pack + .sf-pack { padding-top: calc(var(--sf-rhythm) * 8); }

  .sf-body--price .sf-pricebody {

    padding-top: calc(var(--sf-rhythm) * 2);
    padding-bottom: calc(var(--sf-rhythm) * 2);
  }

  .sf-body--price .sf-process { padding-top: calc(var(--sf-rhythm) * 4); }
}

@media (min-width: 821px) {
  .sf-body--price .sf-tabs { padding-bottom: clamp(18px, 2vw, 28px); }
  .sf-body--price .sf-pricebody .sf-pack:first-child {
    padding-top: clamp(20px, 2.2vw, 30px);
  }
  .sf-body--price .sf-pricebody .sf-pack:last-child {
    padding-bottom: clamp(20px, 2.2vw, 30px);
  }
  .sf-body--price .sf-pricebody { padding-bottom: clamp(18px, 2vw, 28px); }
  .sf-body--price .sf-process { padding-top: clamp(28px, 3.2vw, 44px); }
}

.sf-sectitle {
  font-family: var(--sf-display);

  font-weight: 400;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;

  color: var(--sf-ink);
  margin-bottom: clamp(26px, 3vw, 42px);
}

.sf-process {
  padding-top: clamp(46px, 5vw, 76px);
  padding-bottom: clamp(34px, 4vw, 58px);
}

.sf-pricebody { padding-bottom: var(--sf-sect-y); }

.sf-pricehead {
  padding-top: clamp(18px, 2.5vw, 32px);

<script>
/* ==========================================================================
   SOFIA FILATOVA — behaviour
   Vanilla, no dependencies, no build step. Every feature is optional: each
   one bails out quietly if its markup is not on the page, so you can paste
   individual blocks into Tilda in any combination.
   ========================================================================== */

(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Когда запускаться

     На сайте скрипт стоит последним в body: разметка к этому моменту уже
     построена, и можно работать сразу. В Tilda места в конце body нет —
     код сайта вставляется только в HEAD, а там страницы ещё не существует,
     и всё нижеследующее не нашло бы ни одного блока.

     Поэтому решение принимается по состоянию документа, а не по тому, куда
     нас положили: не достроен — ждём, достроен — работаем сразу. Второй
     путь важен не меньше первого: если просто подписаться на событие, а оно
     уже прошло, скрипт не запустится никогда.
     ------------------------------------------------------------------ */

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  function start() {

    var $  = function (sel, ctx) { return (ctx || document).querySelector(sel); };
    var $$ = function (sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); };

    // The standalone site has one .sf-root wrapping the page. On Tilda every
    // pasted block is its own .sf-root, so anything that reads or writes root
    // state has to cope with a list.
    var roots = $$(".sf-root");
    if (!roots.length) return;
    var root = roots[0];

    /* ------------------------------------------------------------------
       Language — RU / EN, remembered between visits
       ------------------------------------------------------------------ */

    var LANG_KEY = "sf-lang";

    function applyLang(lang) {
      roots.forEach(function (r) { r.setAttribute("data-lang", lang); });
      document.documentElement.setAttribute("lang", lang);
      $$(".sf-lang__btn").forEach(function (btn) {
        btn.classList.toggle("is-active", btn.dataset.lang === lang);
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }

      // Язык выбирает город в прайсе: русскому посетителю показываем Москву,
      // англоязычному — Лиссабон. Ручной выбор вкладки живёт до следующей
      // смены языка.
      showCity(lang === "ru" ? "moscow" : "lisbon");
    }

    function showCity(city) {
      var tabs = $$(".sf-tab");
      if (!tabs.length) return;
      tabs.forEach(function (t) {
        var on = t.dataset.city === city;
        t.classList.toggle("is-active", on);
        t.setAttribute("aria-selected", String(on));
      });
      $$(".sf-pricelist").forEach(function (list) {
        list.hidden = list.dataset.city !== city;
      });
    }

    (function initLang() {
      var saved;
      try { saved = localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }

      var start;
      if (saved === "ru" || saved === "en") {
        start = saved;
      } else {
        start = (navigator.language || "").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
      }
      applyLang(start);

      $$(".sf-lang__btn").forEach(function (btn) {
        btn.addEventListener("click", function () { applyLang(btn.dataset.lang); });
      });
    })();

    /* ------------------------------------------------------------------
       Header: shadow once scrolled, mobile drawer
       ------------------------------------------------------------------ */

    (function initHeader() {
      var burger = $(".sf-burger");
      var drawer = $(".sf-drawer");
      if (!burger || !drawer) return;

      var setOpen = function (open) {
        burger.classList.toggle("is-open", open);
        drawer.classList.toggle("is-open", open);
        burger.setAttribute("aria-expanded", String(open));
        document.body.classList.toggle("sf-noscroll", open);
      };

      burger.addEventListener("click", function () {
        setOpen(!drawer.classList.contains("is-open"));
      });
      $$(".sf-drawer__link", drawer).forEach(function (a) {
        a.addEventListener("click", function () { setOpen(false); });
      });
      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
      // A resize past the desktop breakpoint should not leave the body locked.
      window.addEventListener("resize", function () {
        if (window.innerWidth > 980) setOpen(false);
      });
    })();

    /* ------------------------------------------------------------------
       Price: city / currency tabs
       ------------------------------------------------------------------ */

    /* ------------------------------------------------------------------
       Текущая страница в меню

       На сайте активный пункт проставляет сборщик, прямо в разметке. В Tilda
       блок шапки один на все страницы, и пометить пункт там некому — «Главная»
       осталась бы подсвеченной везде. Поэтому сверяем адрес сами.

       Адреса у сайта и у Tilda разные: «about.html» против «/about», корень —
       то «/», то «/index.html». Поэтому сравниваем не строки целиком, а имя
       страницы: хвост пути без расширения, причём «index» считаем корнем.
       ------------------------------------------------------------------ */

    (function initCurrentLink() {
      var links = $$(".sf-header__link, .sf-drawer__link");
      if (!links.length) return;

      function slug(path) {
        var last = String(path || "").split("?")[0].split("#")[0];
        last = last.replace(/\/+$/, "").split("/").pop() || "";
        last = last.replace(/\.html$/, "");
        return last === "index" ? "" : last;
      }

      var here = slug(window.location.pathname);
      links.forEach(function (a) {
        a.classList.toggle("is-active", slug(a.getAttribute("href")) === here);
      });
    })();

    (function initPriceTabs() {
      var tabs = $$(".sf-tab");
      if (!tabs.length) return;

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () { showCity(tab.dataset.city); });
      });
    })();

    /* ------------------------------------------------------------------
       Сетка на главной заканчивается полным рядом
       ------------------------------------------------------------------ */

    (function initGridTrim() {
      var grid = $(".sf-homegrid .sf-mosaic");
      if (!grid) return;
      var items = $$(".sf-mosaic__item", grid);
      if (items.length < 4) return;

      function trim() {
        items.forEach(function (i) { i.hidden = false; });

        // Ряды не заданы разметкой — их складывает флексбокс, и на разной
        // ширине они разные. Границу ряда определяем по offsetTop.
        var rows = [], prev = null;
        items.forEach(function (i) {
          if (prev === null || i.offsetTop !== prev) { rows.push([]); prev = i.offsetTop; }
          rows[rows.length - 1].push(i);
        });
        if (rows.length < 2) return;

        var heights = rows.map(function (r) { return r[0].getBoundingClientRect().height; });
        var rest = heights.slice(0, -1).sort(function (a, b) { return a - b; });
        var median = rest[Math.floor(rest.length / 2)];

        // Неполный ряд флексбокс растягивает по ширине, и он выходит заметно
        // выше остальных. Это и есть признак хвоста.
        if (heights[heights.length - 1] > median * 1.25) {
          rows[rows.length - 1].forEach(function (i) { i.hidden = true; });
        }
      }

      trim();
      window.addEventListener("resize", trim);
    })();

    /* ------------------------------------------------------------------
       Lightbox
       ------------------------------------------------------------------ */

    (function initLightbox() {
      var triggers = $$(".sf-mosaic__btn");
      var box = $(".sf-lightbox");
      if (!triggers.length || !box) return;

      var stageImg = $(".sf-lightbox__stage img", box);
      var counter  = $(".sf-lightbox__count", box);
      var index    = 0;
      var lastFocus = null;
      var timer = null;          // показ серии по очереди

      var SLIDE_MS = 3600;

      function stopShow() {
        if (timer) { window.clearInterval(timer); timer = null; }
        box.classList.remove("is-playing");
      }

      function startShow() {
        stopShow();
        box.classList.add("is-playing");
        timer = window.setInterval(function () { show(index + 1); }, SLIDE_MS);
      }

      function show(i) {
        index = (i + triggers.length) % triggers.length;
        var trigger = triggers[index];
        stageImg.src = trigger.dataset.full || $("img", trigger).src;
        stageImg.alt = trigger.dataset.alt || "";
        if (counter) counter.textContent = (index + 1) + " / " + triggers.length;
        if (timer) {                     // перезапуск полосы отсчёта
          var bar = $(".sf-lightbox__bar", box);
          if (bar) { bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = ""; }
        }
        preload(index + 1);
        preload(index - 1);
      }

      function preload(i) {
        var t = triggers[(i + triggers.length) % triggers.length];
        if (!t) return;
        var pre = new Image();
        pre.src = t.dataset.full || "";
      }

      function open(i, play) {
        lastFocus = document.activeElement;
        show(i);
        box.classList.add("is-open");
        box.setAttribute("aria-hidden", "false");
        document.body.classList.add("sf-noscroll");
        var closeBtn = $(".sf-lightbox__close", box);
        if (closeBtn) closeBtn.focus();
        if (play) startShow();
      }

      function close() {
        stopShow();
        box.classList.remove("is-open");
        box.setAttribute("aria-hidden", "true");
        document.body.classList.remove("sf-noscroll");
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      triggers.forEach(function (t, i) {
        t.addEventListener("click", function () { open(i); });
      });



      var closeBtn = $(".sf-lightbox__close", box);
      var prevBtn  = $(".sf-lightbox__prev", box);
      var nextBtn  = $(".sf-lightbox__next", box);
      if (closeBtn) closeBtn.addEventListener("click", close);
      if (prevBtn)  prevBtn.addEventListener("click", function () { stopShow(); show(index - 1); });
      if (nextBtn)  nextBtn.addEventListener("click", function () { stopShow(); show(index + 1); });

      // Click the backdrop (but not the photo or the controls) to dismiss

        if (e.target === box || e.target.classList.contains("sf-lightbox__stage")) close();
      });

      window.addEventListener("keydown", function (e) {
        if (!box.classList.contains("is-open")) return;
        if (e.key === "Escape")     { close(); }
        if (e.key === "ArrowLeft")  { stopShow(); show(index - 1); }
        if (e.key === "ArrowRight") { stopShow(); show(index + 1); }
      });

      // Swipe on touch
      var startX = null;
      box.addEventListener("touchstart", function (e) {
        startX = e.changedTouches[0].clientX;
      }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 48) { stopShow(); show(index + (dx < 0 ? 1 : -1)); }
        startX = null;
      }, { passive: true });
    })();

    /* ------------------------------------------------------------------
       Смена экранов: гасим страницу перед переходом
       ------------------------------------------------------------------ */

    (function initExitFade() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var FADE_MS = 260;

      $$("a[href]").forEach(function (a) {
        var url = a.getAttribute("href");
        if (!url) return;
        // Якоря, внешние ссылки и мессенджеры уводят со страницы сами —
        // гасить её под ними незачем.
        if (url.charAt(0) === "#") return;
        if (a.target === "_blank") return;
        if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return;

        a.addEventListener("click", function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          e.preventDefault();
          document.body.classList.add("sf-leaving");
          window.setTimeout(function () { window.location.href = url; }, FADE_MS);
        });
      });

      // Возврат «назад» может отдать страницу из кеша уже погашенной.
      window.addEventListener("pageshow", function () {
        document.body.classList.remove("sf-leaving");
      });
    })();

    /* ------------------------------------------------------------------
       Контакты: кнопка раскрывает три канала
       ------------------------------------------------------------------ */

    (function initReach() {
      $$(".sf-reach").forEach(function (box) {
        var btn = $(".sf-reach__open", box);
        var list = $(".sf-reach__list", box);
        if (!btn || !list) return;
        var closeBtn = $(".sf-reach__close", list);
        var lastFocus = null;

        function open() {
          lastFocus = document.activeElement;
          list.hidden = false;
          // hidden снимаем раньше класса, иначе переход не проиграет: элемент
          // появляется уже в конечном состоянии. Начальное состояние закрепляем
          // принудительным пересчётом, а не requestAnimationFrame: в фоновой
          // вкладке кадр может не наступить, и ссылки застряли бы на opacity 0.
          void list.offsetWidth;
          box.classList.add("is-open");
          btn.setAttribute("aria-expanded", "true");
          document.body.classList.add("sf-noscroll");
          // Фокус на само окно, а не на крестик: скриптовый фокус браузер
          // считает клавиатурным и обводит цель рамкой.
          list.focus();
        }

        function close() {
          box.classList.remove("is-open");
          // Закрытие мгновенное — как у лайтбокса: ждать выхода незачем.
          list.hidden = true;
          btn.setAttribute("aria-expanded", "false");
          document.body.classList.remove("sf-noscroll");
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        btn.addEventListener("click", open);
        if (closeBtn) closeBtn.addEventListener("click", close);

        // Клик по завесе закрывает; по самим ссылкам — уводит в мессенджер.
        list.addEventListener("click", function (e) {
          if (e.target === list) close();
        });

        // Мессенджер открывается в соседней вкладке, страница остаётся за
        // окном. Не закрой мы его здесь — вернувшись, человек застал бы
        // завесу на месте и заблокированную прокрутку.
        $$(".sf-reach__link", list).forEach(function (a) {
          a.addEventListener("click", close);
        });

        window.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && box.classList.contains("is-open")) close();
        });
      });
    })();

  }

})();
</script>
