# Публикация сайта на GitHub Pages.
#
# enablement: true у configure-pages создаёт сам сайт Pages, если он ещё не
# заведён — поэтому включать ничего руками в настройках не нужно. Дальше
# содержимое репозитория выкладывается как есть: сборка не требуется, все
# страницы уже собраны и лежат в корне.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: важна последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Черновики раскладок в «варианты/» — рабочий материал, наружу не идут.
      - name: Убрать листы сравнений из выкладки
        run: rm -rf "варианты"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
