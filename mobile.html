<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мобильная версия — Sofia Filatova</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap">
<style>
  :root { --frame-w: 390px; --frame-h: 844px; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 26px 20px 40px;
    background: #2b2825;
    color: #e8e2db;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 14px;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .bar button {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(232, 226, 219, 0.22);
    background: transparent;
    color: #e8e2db;
    cursor: pointer;
    transition: background-color .25s, border-color .25s;
  }
  .bar button:hover { border-color: rgba(232, 226, 219, 0.5); }
  .bar button.on { background: #e8e2db; color: #2b2825; border-color: #e8e2db; }

  /* Телефон. Экран ровно 390×844 — размер iPhone 14/15, поэтому внутри
     срабатывают те же медиазапросы, что и на настоящем аппарате. */
  .phone {
    position: relative;
    /* Рамка добавляется СНАРУЖИ: экран остаётся ровно 390×844, иначе
       корпус съедал бы ширину и медиазапросы срабатывали не там. */
    width: calc(var(--frame-w) + 24px);
    height: calc(var(--frame-h) + 24px);
    padding: 12px;
    border-radius: 46px;
    background: #17150f;
    box-shadow: 0 0 0 2px #3a352e, 0 30px 60px rgba(0, 0, 0, .45);
    flex: none;
  }
  .phone::after {                 /* вырез под камеру */
    content: "";
    position: absolute;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    width: 104px; height: 26px;
    border-radius: 14px;
    background: #17150f;
    pointer-events: none;
    z-index: 2;
  }
  .screen {
    width: 100%; height: 100%;
    border: 0;
    border-radius: 34px;
    background: #faf8f6;
    display: block;
  }

  .hint { font-size: 12px; opacity: .5; text-align: center; max-width: 420px; line-height: 1.6; }
  .hint code { font-family: ui-monospace, Menlo, monospace; }

  .tools { display: flex; gap: 8px; align-items: center; font-size: 12px; opacity: .75; }
  .tools select {
    font: inherit; padding: 5px 8px; border-radius: 8px;
    border: 1px solid rgba(232,226,219,.22); background: #2b2825; color: #e8e2db;
  }
</style>
</head>
<body>

<div class="bar" id="bar"></div>

<div class="tools">
  <label for="size">Аппарат</label>
  <select id="size">
    <option value="390x844">iPhone 14 / 15 — 390×844</option>
    <option value="375x812">iPhone X / 13 mini — 375×812</option>
    <option value="430x932">iPhone 15 Pro Max — 430×932</option>
    <option value="360x800">Android — 360×800</option>
  </select>
</div>

<div class="phone">
  <iframe class="screen" id="screen" src="index.html" title="Мобильная версия сайта"></iframe>
</div>

<p class="hint">
  Внутри — настоящий сайт, всё кликается и листается.
</p>

<script>
  var PAGES = [
    ["index.html",     "Главная"],
    ["portraits.html", "Портреты"],
    ["street.html",    "Улица"],
    ["love.html",      "Пары"],
    ["about.html",     "Обо мне"],
    ["price.html",     "Прайс"],
    ["contact.html",   "Контакты"]
  ];

  var screenEl = document.getElementById("screen");
  var bar = document.getElementById("bar");

  PAGES.forEach(function (p, i) {
    var b = document.createElement("button");
    b.textContent = p[1];
    b.className = i === 0 ? "on" : "";
    b.addEventListener("click", function () {
      screenEl.src = p[0];
      [].forEach.call(bar.children, function (x) { x.classList.remove("on"); });
      b.classList.add("on");
    });
    bar.appendChild(b);
  });

  document.getElementById("size").addEventListener("change", function () {
    var wh = this.value.split("x");
    document.documentElement.style.setProperty("--frame-w", wh[0] + "px");
    document.documentElement.style.setProperty("--frame-h", wh[1] + "px");
  });
</script>

</body>
</html>
